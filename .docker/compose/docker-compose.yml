services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  api:
    container_name: newsapp-api
    image: filipjovanovski1/newsapp-api:latest
    restart: unless-stopped
    build:
      context: ../..                       # repo root (because deploy/compose is 2 levels deep)
      dockerfile: NewsApplication.Web/Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"

      # API (inside compose) must connect to postgres service on 5432
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=true"

      # External API key
      Newsdata__ApiKey: "${NEWSDATA_API_KEY}"

      # DevController protection + CSV root
      Dev__Enabled: "${DEV_ENABLED}"
      Dev__AdminToken: "${DEV_ADMIN_TOKEN}"
      Dev__DataRoot: "/app/Data"

      # optional if you want migrations in container startup
      Database__ApplyMigrationsOnStartup: "true"

    # Mount your large CSVs into the API container (recommended)
    volumes:
      - ../../NewsApplication.Repository/Data:/app/Data:ro

    # Optional: expose API to host for debugging (not required when web proxies it)
    # ports:
    #   - "8082:8080"

  web:
    container_name: newsapp-web
    image: filipjovanovski1/newsapp-web:latest
    restart: unless-stopped
    build:
      context: ../../NewsApplication.Web/ClientApp
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgadmin-data:
