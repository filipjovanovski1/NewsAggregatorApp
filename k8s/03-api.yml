apiVersion: v1
kind: Service
metadata:
  name: newsapp-api
  namespace: newsapp
spec:
  selector:
    app: newsapp-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: newsapp-api
  namespace: newsapp
spec:
  # Load-bearing: the in-process schedulers have no distributed lock. Do not scale this
  # deployment above one replica until dispatch and polling acquire one.
  replicas: 1
  selector:
    matchLabels:
      app: newsapp-api
  template:
    metadata:
      labels:
        app: newsapp-api
    spec:
      containers:
        - name: api
          image: filipjovanovski1/newsapp-api:latest
          ports:
            - containerPort: 8080

          # Non-secret configuration (from ConfigMap)
          envFrom:
            - configMapRef:
                name: newsapp-config

          # Secrets stay explicit because your Secret keys
          # are not the same as the env var names your app expects
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: newsapp-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: newsapp-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: newsapp-secrets
                  key: POSTGRES_DB

            - name: Newsdata__ApiKey
              valueFrom:
                secretKeyRef:
                  name: newsapp-secrets
                  key: NEWSDATA_API_KEY

            - name: Dev__AdminToken
              valueFrom:
                secretKeyRef:
                  name: newsapp-secrets
                  key: DEV_ADMIN_TOKEN

            - name: DiscoveryPipeline__SharedSecret
              valueFrom:
                secretKeyRef:
                  name: newsapp-secrets
                  key: DISCOVERY_PIPELINE_SHARED_SECRET

            # Build the connection string from the env vars above
            - name: ConnectionStrings__Default
              value: "Host=postgres;Port=5432;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD);Include Error Detail=true"
