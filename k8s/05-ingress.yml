apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: newsapp
  namespace: newsapp
spec:
  ingressClassName: nginx
  rules:
    - host: newsapp.local
      http:
        paths:
          # API routes (NO /api prefix)
          - path: /_routes
            pathType: Prefix
            backend:
              service:
                name: newsapp-api
                port:
                  number: 8080
          - path: /dev
            pathType: Prefix
            backend:
              service:
                name: newsapp-api
                port:
                  number: 8080
          - path: /scope
            pathType: Prefix
            backend:
              service:
                name: newsapp-api
                port:
                  number: 8080
          - path: /search
            pathType: Prefix
            backend:
              service:
                name: newsapp-api
                port:
                  number: 8080
          - path: /articles
            pathType: Prefix
            backend:
              service:
                name: newsapp-api
                port:
                  number: 8080

          # OPTIONAL: keep /api/* working too
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: newsapp-api
                port:
                  number: 8080

          # Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: newsapp-web
                port:
                  number: 80
