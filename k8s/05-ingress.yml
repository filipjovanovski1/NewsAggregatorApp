apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: newsapp
  namespace: newsapp
spec:
  rules:
    - host: newsapp.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: newsapp-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: newsapp-web
                port:
                  number: 80
