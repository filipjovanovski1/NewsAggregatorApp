[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "news-feed-ingestion"
version = "0.1.0"
description = "RSS/Atom polling and article extraction worker for NewsAggregatorApp"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6.0.11,<7",
  "httpx>=0.27,<1",
  "lxml>=5,<7",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "trafilatura>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[project.scripts]
news-feed-ingestion = "news_feed_ingestion.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/news_feed_ingestion"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
